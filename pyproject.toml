[project]
name = "setupaiv2"
version = "0.1.0"
description = "Python environment for LangGraph, LangChain, Pydantic, and local Langfuse"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.9",
    "langchain-core>=1.7.5",
    "langchain-openai>=1.7.4",
    "langfuse>=5.1.0",
    "langgraph>=1.2.19",
    "langsmith>=0.14.17",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "tree-sitter>=0.26.1",
    "tree-sitter-java>=0.23.5",
]

[tool.uv]
package = false
