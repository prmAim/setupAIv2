name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.7'
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - name: Check offline environment
        run: uv run --locked python tools/check_environment.py
      - name: Run unit tests
        run: uv run --locked python -m unittest discover -s tests -v
